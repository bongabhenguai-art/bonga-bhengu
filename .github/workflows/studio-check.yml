name: Studio syntax checks
on:
  push:
    paths:
      - 'creative-studio/**'
      - '.github/workflows/studio-check.yml'
  pull_request:
    paths:
      - 'creative-studio/**'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q creative-studio

      - name: Run worker routing tests
        working-directory: creative-studio
        run: python -m unittest discover -s tests -v
