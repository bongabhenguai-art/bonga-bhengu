<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fukulisane One — Live Service Workspace</title>
<style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#152018;--muted:#6b756d;--line:#dfe5df;--dark:#17231b;--accent:#a9e66f;--amber:#e5a91b;--red:#c84b4b;--blue:#4e7dd1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:.16em}.logo i{font-style:normal;background:var(--dark);color:var(--accent);padding:7px;border-radius:8px;margin-right:9px}.live{font-size:11px;color:#4d6a55;background:#edf7e9;padding:7px 10px;border-radius:999px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{background:var(--dark);color:#dce5dc;padding:22px 14px}aside .section{font-size:10px;letter-spacing:.16em;color:#89998c;margin:20px 10px 8px}nav button{width:100%;background:transparent;color:#cbd6cc;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}nav button.active,nav button:hover{background:#26382b;color:#fff}main{padding:34px;max-width:1250px;width:100%;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.title h1{font-size:34px;letter-spacing:-.04em;margin:0 0 6px}.title p{margin:0;color:var(--muted)}.primary{background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-weight:800}.accent{background:var(--accent);color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px}.label{font-size:10px;letter-spacing:.15em;font-weight:900;color:#78837a}.num{font-size:32px;font-weight:900;letter-spacing:-.05em;margin-top:10px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.sectiontitle{margin:30px 0 12px;font-size:18px}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.action{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.action:last-child{border-bottom:0}.action h3{margin:5px 0;font-size:15px}.action p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.pill{font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px;background:#edf0ec;color:#5e695f}.pill.amber{background:#fff3d7;color:#8b6811}.pill.blue{background:#eaf0fc;color:#3f65aa}.pill.green{background:#e9f8df;color:#477329}.evidence{margin-top:15px;background:#f8faf7;border:1px solid var(--line);border-radius:14px;padding:15px}.evidence p{color:var(--muted);font-size:12px;line-height:1.5}.scan{max-width:820px;margin:45px auto}.scanbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;border:1px solid var(--line);padding:13px;border-radius:10px;outline:0}.input:focus{border-color:#8db86a}.scanbox button{width:100%;margin-top:10px;padding:14px}.scoreline{display:flex;justify-content:space-between;align-items:end;margin:25px 0}.score{font-size:70px;font-weight:900}.bar{height:9px;background:#e8ece7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--dark)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.list{margin:0;padding-left:19px;color:#536057;line-height:1.9}.package-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pkg h3{font-size:18px;margin:8px 0}.pkg ul{padding-left:18px;color:var(--muted);line-height:1.8}.pkg.featured{border-color:var(--dark);box-shadow:0 8px 25px rgba(20,32,24,.08)}.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:13px 16px;border-radius:11px;display:none;z-index:20}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid,.package-grid{grid-template-columns:1fr 1fr}.cols,.two{grid-template-columns:1fr}}@media(max-width:600px){main{padding:20px}.grid,.package-grid,.fields{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column}.top{padding:0 18px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const state={business:null,view:'overview',actions:[
{id:'A-10482',problem:'Low social visibility',title:'Create 3 educational short videos',owner:'Fukulisane AI',status:'IN PROGRESS',next:'Generate scripts',engine:'Content + Video Engine'},
{id:'A-10483',problem:'Website conversion gap',title:'Improve homepage call-to-action',owner:'Website Engine',status:'NEEDS CUSTOMER',next:'Approve recommendation',engine:'Website Engine'},
{id:'A-10484',problem:'Search visibility',title:'Complete local search profile',owner:'Search Engine',status:'RECOMMENDED',next:'Connect authorized search data',engine:'Search Visibility'}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function nav(){return `<aside><div class="label" style="color:#9aaa9d">CUSTOMER SERVICE</div><nav><button class="${state.view==='overview'?'active':''}" onclick="go('overview')">Overview</button><button class="${state.view==='scan'?'active':''}" onclick="go('scan')">Public visibility</button><button class="${state.view==='actions'?'active':''}" onclick="go('actions')">Work queue</button><button class="${state.view==='packages'?'active':''}" onclick="go('packages')">Packages</button></nav><div class="section">ENGINES</div><nav><button onclick="toast('Deep Search: requires a live source connection')">Deep Search</button><button onclick="toast('Content Studio: ready for connected business data')">Content Studio</button><button onclick="toast('Video Engine: ready for production integration')">Video Engine</button><button onclick="toast('Publishing: no account connected')">Publishing</button><button onclick="toast('Analytics: no live source connected')">Analytics</button></nav><div class="section">CONTROL</div><nav><button onclick="toast('AI Orchestrator is coordinating the service loop')">Orchestrator</button><button onclick="toast('Audit trail available for completed actions')">Audit log</button></nav></aside>`}
function header(){return `<header class="top"><div class="logo"><i>F</i>FUKULISANE</div><div class="live">● LIVE SERVICE SYSTEM</div></header>`}
function shell(body){document.getElementById('app').innerHTML=`<div class="app">${header()}<div class="layout">${nav()}<main>${body}</main></div></div>`}
function overview(){if(!state.business)return landing();let b=state.business;let inprog=state.actions.filter(a=>a.status==='IN PROGRESS').length; shell(`<div class="crumb">Customer Service / ${esc(b.name)}</div><div class="title"><div><h1>${esc(b.name)}</h1><p>${esc(b.location||'Location not provided')} · ${esc(b.package||'Not subscribed')} · ${b.status}</p></div><button class="primary accent" onclick="go('actions')">Open work queue →</button></div><div class="grid"><div class="card"><div class="label">PUBLIC VISIBILITY</div><div class="num">NOT ASSESSED</div><div class="sub">No live public scan stored</div></div><div class="card"><div class="label">TARGET</div><div class="num">—</div><div class="sub">Set after connected audit</div></div><div class="card"><div class="label">ACTIVE ACTIONS</div><div class="num">${inprog}</div><div class="sub">Real work state</div></div><div class="card"><div class="label">CONNECTIONS</div><div class="num">0</div><div class="sub">No external source connected</div></div></div><h2 class="sectiontitle">Fukulisane is working on</h2><div class="cols"><div class="card">${state.actions.map(action).join('')}</div><div class="card"><div class="label">NEXT OPPORTUNITY</div><h3>Connect the business before making claims.</h3><p class="sub" style="line-height:1.6">Fukulisane does not invent Google, social, website or performance metrics. Connect authorized sources to unlock the deeper audit and measurable execution.</p><div class="evidence"><b>Source state</b><p>Public data: not assessed in this local workspace. Authorized data: 0 connections. Internal data: customer record only.</p></div></div></div>`)}
function action(a){return `<div class="action"><div><span class="pill ${a.status==='IN PROGRESS'?'blue':a.status==='NEEDS CUSTOMER'?'amber':''}">${a.status}</span><h3>${esc(a.title)}</h3><p>${esc(a.problem)} · Owner: ${esc(a.owner)} · Engine: ${esc(a.engine)} · Next: ${esc(a.next)}</p></div><button class="primary" onclick="advance('${a.id}')">Advance</button></div>`}
function landing(){shell(`<section class="scan"><div class="label">FUKULISANE PUBLIC PROOF</div><h1 style="font-size:46px;letter-spacing:-.05em;margin:12px 0">Prove what the public can see.</h1><p style="color:var(--muted);line-height:1.7">Start with the free public visibility journey. This local app will create a customer service record and preserve the rule that unsupported external metrics are never fabricated.</p><div class="scanbox"><form id="start"><div class="fields"><input id="b" class="input" required placeholder="Business name"><input id="l" class="input" placeholder="City / country"></div><button class="primary accent">Start Fukulisane service record →</button></form><p class="sub">Live external research is intentionally shown as “not assessed” until a real source/connector is available.</p></div></section>`);document.getElementById('start').onsubmit=e=>{e.preventDefault();state.business={name:document.getElementById('b').value.trim(),location:document.getElementById('l').value.trim(),status:'ACTIVE',package:'Not selected',createdAt:new Date().toISOString()};localStorage.setItem('fukulisane_business',JSON.stringify(state.business));go('overview')}}
function scan(){shell(`<div class="crumb">Customer Service / Public Visibility</div><div class="title"><div><h1>Public visibility proof</h1><p>Evidence first. No fabricated scores.</p></div></div><div class="card"><div class="label">CURRENT SOURCE STATE</div><div class="scoreline"><div><div class="score">—</div><div class="sub">PUBLIC VISIBILITY SCORE</div></div><span class="pill amber">NOT ASSESSED</span></div><div class="bar"><i style="width:0"></i></div><div class="evidence"><b>Why no score is shown</b><p>A trustworthy score requires real public-source discovery and evidence. This standalone workspace has no external research connector, so it refuses to manufacture a number.</p><p><b>Next:</b> connect a live research service, then the Deep Search engine can discover sources, profile the business, find gaps and pass evidence to the Business Score engine.</p></div></div><div class="two"><div class="card"><div class="label">PUBLIC DATA</div><h3>Discovery</h3><ul class="list"><li>Website — not assessed</li><li>Search — not assessed</li><li>Social — not assessed</li><li>Reviews — not assessed</li><li>Local listings — not assessed</li></ul></div><div class="card"><div class="label">AUTHORIZED DATA</div><h3>Connections</h3><ul class="list"><li>Google — not connected</li><li>Instagram — not connected</li><li>Facebook — not connected</li><li>Analytics — not connected</li><li>CRM — not connected</li></ul></div></div>`)}
function actions(){let b=state.business||{name:'No business'};shell(`<div class="crumb">Customer Service / Work Queue</div><div class="title"><div><h1>Work queue</h1><p>${esc(b.name)} · every recommendation becomes an executable action.</p></div><button class="primary accent" onclick="newAction()">Create action</button></div><div class="card">${state.actions.map(action).join('')}</div><div class="evidence"><b>Universal workflow</b><p>DETECT → RECOMMEND → PLAN → PRODUCE → REVIEW → CUSTOMER APPROVAL → PUBLISH → VERIFY → MEASURE → RESCORE.</p></div>`)}
function packages(){shell(`<div class="crumb">Customer Service / Packages</div><div class="title"><div><h1>Service packages</h1><p>Only capabilities that are actually delivered should be included.</p></div></div><div class="package-grid"><div class="card pkg"><div class="label">FOUNDATION</div><h3>Make the business discoverable.</h3><ul><li>Public visibility research</li><li>Digital audit</li><li>Website assessment</li><li>Social profile discovery</li><li>Profile optimization</li><li>Visibility dashboard</li></ul><button class="primary" onclick="choose('Foundation')">Choose Foundation</button></div><div class="card pkg featured"><div class="label">GROWTH</div><h3>Increase visibility and opportunities.</h3><ul><li>Everything in Foundation</li><li>AI content</li><li>Social publishing</li><li>SEO</li><li>Content calendar</li><li>Lead capture</li><li>Monitoring + analytics</li></ul><button class="primary accent" onclick="choose('Growth')">Choose Growth</button></div><div class="card pkg"><div class="label">INTELLIGENCE GROWTH</div><h3>Turn intelligence into continuous growth.</h3><ul><li>Everything above</li><li>Brand strategy</li><li>Marketing strategy</li><li>Campaign execution</li><li>Lead funnels</li><li>CRM automation</li><li>AI agents + executive reporting</li></ul><button class="primary" onclick="choose('Intelligence Growth')">Choose</button></div></div>`)}
function choose(p){if(!state.business){toast('Start a business record first');return}state.business.package=p;localStorage.setItem('fukulisane_business',JSON.stringify(state.business));toast(p+' selected');go('overview')}
function advance(id){let a=state.actions.find(x=>x.id===id);let flow=['RECOMMENDED','ACCEPTED','PLANNED','IN PROGRESS','REVIEW','NEEDS CUSTOMER','SCHEDULED','PUBLISHED','VERIFIED','MEASURED','COMPLETED'];let i=flow.indexOf(a.status);a.status=flow[Math.min(i+1,flow.length-1)];a.next=a.status==='NEEDS CUSTOMER'?'Customer approval':a.status==='PUBLISHED'?'Verify publication':a.status==='MEASURED'?'Rescore business':'Continue workflow';toast(a.id+' → '+a.status);go('actions')}
function newAction(){state.actions.unshift({id:'A-'+Math.floor(10000+Math.random()*89999),problem:'New opportunity',title:'Review and define the next improvement action',owner:'Fukulisane Orchestrator',status:'RECOMMENDED',next:'Define success metric',engine:'Business Improvement Engine'});toast('New action created');go('actions')}
function go(v){state.view=v;({overview,scan,actions,packages}[v]||overview)()}
try{state.business=JSON.parse(localStorage.getItem('fukulisane_business')||'null')}catch{};go(state.business?'overview':'scan');
</script></body></html>
